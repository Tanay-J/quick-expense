plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.dropspend.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "app.dropspend.tracker"
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName "1.8.0"
    }

    signingConfigs {
        // Uses debug/CI keystore automatically so APKs built on GitHub Actions install directly
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Automatically sync root web files into assets/public before every APK build
tasks.register('syncWebAssets', Copy) {
    from('../../') {
        include 'index.html'
        include 'styles.css'
        include 'app.js'
        include 'spec-ui.js'
        include 'native-bridge.js'
        include 'parser.js'
        include 'insights.js'
        include 'sync.js'
        include 'manifest.json'
        include 'sw.js'
        include 'icons/**'
    }
    into 'src/main/assets/public'
}

preBuild.dependsOn(syncWebAssets)

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
